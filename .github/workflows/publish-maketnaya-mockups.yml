name: Publish Maketnaya with Mockups

on:
  push:
    branches:
      - gifts-layout-workbench-mockups-source
    paths:
      - "index.html"
      - "editor.html"
      - "mockup.html"
      - "save-profile.html"
      - "mockup-profiles.json"
      - "direct-mode.js"
      - "tools/**"
      - "assets/**"
      - "tests/**"
      - "vendor/**"
      - ".github/workflows/publish-maketnaya-mockups.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gifts-layout-workbench-mockups-publish
  cancel-in-progress: true

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and syntax checks
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          node tools/build-launcher.mjs
          test -f launcher.js
          test -f mockup.html
          test -f save-profile.html
          test -f mockup-profiles.json
          node -e 'const x=require("./mockup-profiles.json"); if(x.schema!=="gifts-mockup-profile-registry/v1"||!Array.isArray(x.profiles)) process.exit(1)'
          node --check direct-mode.js
          node --check assets/index-BpU9kvz8.js
          grep -q 'background:"rgba(0,0,0,0)"' assets/index-BpU9kvz8.js
          grep -q 'ctx.drawImage(compositeImage' assets/index-BpU9kvz8.js
          node --check launcher.js
          grep -q "gifts-layout-workbench-mockups" launcher.js
          grep -q "Mockup Lab" launcher.js
          grep -q 'gwb-door-stage' launcher.js
          grep -q 'gwb-door-left' launcher.js
          grep -q 'gwb-door-right' launcher.js
          if grep -q 'gwb-seam' launcher.js; then echo "green center seam must be absent from door animation"; exit 1; fi
          grep -q 'gwb-door-lock' launcher.js
          grep -Fq '<div class="gwb-door gwb-door-left"><div class="gwb-door-lock">М</div></div>' launcher.js
          grep -q 'right:-38px;left:auto' launcher.js
          if grep -q 'gwbLockOpen' launcher.js; then echo "Maketnaya mark must ride with the door, not animate independently"; exit 1; fi
          grep -q 'gwbDoorGlow' launcher.js
          grep -q 'const OPEN_MS = 2000' launcher.js
          grep -q 'requestAnimationFrame(() => requestAnimationFrame(() =>' launcher.js
          grep -q 'gwb-opening' launcher.js
          grep -q 'gwb-opened' launcher.js
          grep -q 'gwbDoorOpenLeft 2000ms' launcher.js
          grep -q 'gwbDoorOpenRight 2000ms' launcher.js
          if grep -q 'prefers-reduced-motion' launcher.js; then echo "door animation must not be skipped by system reduced-motion setting"; exit 1; fi
          grep -q 'gwb-closing' launcher.js
          grep -q 'gwb-door-stage' launcher.js
          grep -q "const targetOrigin=location.origin" launcher.js
          grep -q 'embeddedMockup = mockup' tools/build-launcher.mjs
          grep -Fq 'https://tohaa28.github.io/gifts-layout-workbench-mockups/assets/mockup-cylinder.mjs' launcher.js
          if grep -Fq 'from &quot;./assets/mockup-cylinder.mjs' launcher.js; then echo "embedded Mockup Editor module paths must be rebased"; exit 1; fi
          grep -q 'Maketnaya -> embedded Mockup Editor handoff failed' .github/workflows/test-direct-workbench.yml
          if grep -q 'src="https://tohaa28.github.io/gifts-layout-workbench-mockups/mockup.html"' launcher.js; then
            echo "launcher must embed Mockup Lab as srcdoc, not remote iframe" >&2
            exit 1
          fi
          grep -q 'corsImg.onerror=()=>direct()' mockup.html
          grep -q 'id="mockupModeButton"' editor.html
          grep -q 'id="orderWaitingWorkspace"' editor.html
          grep -q 'gwbSyncOrderIntroAuthState' editor.html
          grep -q 'intro.hidden=authenticated' editor.html
          grep -q 'Order login hint auth visibility is invalid' .github/workflows/test-direct-workbench.yml
          grep -q 'Ожидание выбора заказа' editor.html
          grep -q 'gwbSyncOrderWorkspaceWaiting' editor.html
          grep -q 'gwbClearOrderArtworkLayers' editor.html
          grep -q 'logoErrorOverlay{visibility:hidden' editor.html
          grep -q 'Artwork layers were not restored after returning to order' .github/workflows/test-direct-workbench.yml
          grep -q 'Returning to order list did not clear the right workspace' .github/workflows/test-direct-workbench.yml
          grep -q 'id="mockupShell"' editor.html
          grep -q 'shared Maketnaya visual system' mockup.html
          grep -q 'class="brand"><span class="mark"' mockup.html
          grep -q 'РЕДАКТОР МОКАПОВ' mockup.html
          grep -q -- '--green:#81b315' mockup.html
          grep -q -- '--charcoal:#435159' mockup.html
          grep -q -- '--header-h:106px' mockup.html
          grep -q 'html.embedded .site-header{display:none!important}' mockup.html
          grep -q 'class="mockup-shell-brand"' editor.html
          grep -q 'class="mockup-shell-mark"' editor.html
          grep -q 'grid-template-rows:106px 1fr' editor.html
          if grep -q 'class="giftsWordmark"' mockup.html; then echo "Mockup editor must use the same Maketnaya brand header"; exit 1; fi
          if grep -q '<h1>Mockup Lab</h1>' mockup.html; then echo "Technical Mockup Lab header must stay removed"; exit 1; fi
          grep -q 'findProfiles=state' editor.html
          grep -q 'jobs.length' editor.html
          grep -q 'id="mappingSave"' mockup.html
          grep -q 'id="mappingDelete"' mockup.html
          grep -q 'id="mappingOperationStatus"' mockup.html
          grep -q 'Сохранение привязки…' mockup.html
          grep -q 'Изменение привязки…' mockup.html
          grep -q 'Удаление привязки…' mockup.html
          grep -q 'beginMappingMutation' mockup.html
          grep -q 'failMappingMutation' mockup.html
          grep -q 'mapping status UI' tests/mockup-cylinder-browser.mjs
          grep -q 'ARTICLE_PHOTO_MIN_LONG_SIDE=500' mockup.html
          grep -q 'ARTICLE_PHOTO_MIN_SHORT_SIDE=300' mockup.html
          grep -q 'filterUsableArticlePhotos' mockup.html
          grep -q 'small-photo filtering' tests/mockup-cylinder-browser.mjs
          grep -q 'handoffManualControls' mockup.html
          grep -Fq '.handoffManualControls{display:none!important}' mockup.html
          grep -q 'async function autoLoadHandoff()' mockup.html
          grep -q 'void autoLoadHandoff();' mockup.html
          grep -q 'setTimeout(()=>{if(!bridgedHandoff)void applyStoredHandoff();},500)' mockup.html
          grep -q 'confirmed-manual' mockup.html
          grep -q 'gifts-mockup-profile-registry-changed' mockup.html
          grep -q 'Contents: Read and write' save-profile.html
          grep -q 'id="templateLoadProgress"' editor.html
          grep -Fq '.asset-readiness{display:none!important}' editor.html
          grep -Fq '#assetReadinessPanel{display:none!important}' mockup.html
          grep -q 'id="logoLoadProgress"' editor.html
          grep -q 'button.classList.toggle("readiness-locked",locked)' editor.html
          if grep -q 'readinessOwnedDisabled' editor.html; then echo "readiness must not own native disabled state"; exit 1; fi
          grep -q 'hasRealOption($("fields"))' editor.html
          grep -q 'gwbGetEditorReadiness' editor.html
          grep -q 'gwbRefreshEditorState' editor.html
          grep -Fq 'c.w*.95' tools/patch-artwork-preflight.mjs
          grep -q 'Default logo fit should use 95% of field coordinates' tests/logo-preflight-browser.mjs
          grep -q 'Transient PrintCheck status must be shown until detail scan finishes' tests/logo-preflight-browser.mjs
          grep -q 'collectProfileJobs' editor.html
          grep -q 'gwbGetMockupTargets' editor.html
          grep -q 'gwbBuildMockupHandoffForField' editor.html
          grep -q 'window.gwbGetMockupTargets=function' tools/patch-artwork-preflight.mjs
          grep -q 'window.gwbBuildMockupHandoffForField=async function' tools/patch-artwork-preflight.mjs
          grep -q '1. Фотографии артикула' mockup.html
          grep -q '2. Поле шаблона для выбранного фото' mockup.html
          grep -q 'photoByField' mockup.html
          grep -q 'profilesForField' mockup.html
          grep -q 'profilesForPhotoCandidate' mockup.html
          grep -q 'Сохранить изменения' mockup.html
          grep -q 'currentFieldPhotoMapping' mockup.html
          grep -q 'id="cylinderControls"' mockup.html
          grep -q 'id="editCylinder"' mockup.html
          grep -q 'mapPointBetweenQuads' mockup.html
          grep -q 'window.gwbGetMockupBinding=buildProfile' mockup.html
          test -f assets/mockup-cylinder.mjs
          grep -q 'cylinderWarpCoordinate' assets/mockup-cylinder.mjs
          grep -q 'cylinderVisibleRange' assets/mockup-cylinder.mjs
          grep -q 'cylinder3DSurfacePoint' assets/mockup-cylinder.mjs
          grep -q 'cylinder3DArcHandle' assets/mockup-cylinder.mjs
          grep -q 'id="cylinderTopArc"' mockup.html
          grep -q 'id="cylinderBottomArc"' mockup.html
          grep -q 'geometry:"3d"' mockup.html
          grep -q '3D cylinder mesh must render the artwork' tests/mockup-cylinder-browser.mjs
          grep -q 'задняя сторона скрывается' mockup.html
          grep -q 'back-face clipping' tests/mockup-cylinder-browser.mjs
          grep -q 'CYLINDER_COORD_MIN=-4' mockup.html
          grep -q 'Синяя рамка — развёртка нанесения' mockup.html
          grep -q 'out-of-frame geometry' tests/mockup-cylinder-browser.mjs
          grep -q 'CYLINDER_WORKSPACE={xMin:-1,xMax:2' mockup.html
          grep -q 'cylinderWorkspace' mockup.html
          grep -q 'Серые зоны — виртуальное продолжение цилиндра' mockup.html
          grep -q 'expanded workspace' tests/mockup-cylinder-browser.mjs
          grep -q 'verifyMockupCylinder(browserContext)' .github/workflows/test-direct-workbench.yml
          if grep -q 'disabled=!field' mockup.html; then echo "Article photos must stay selectable before field selection"; exit 1; fi
          if grep -q 'void autoApplySavedProfile(false)' mockup.html; then echo "Registry loading must not hijack photo selection"; exit 1; fi
          if grep -q 'mappingToggle' mockup.html; then echo "Legacy one-button mapping toggle must be removed"; exit 1; fi
          grep -q 'autoApplySavedProfile(true)' mockup.html
          grep -q 'requestGitBridgeMutation' mockup.html
          grep -q 'openProfileLibraryIndex' mockup.html
          grep -q 'class="libraryItem" data-profile-index=' mockup.html
          grep -q '.candidate:not(:disabled){cursor:pointer}' mockup.html
          grep -Fq 'PROFILE_SAVE_URL+"?bridge=1"' mockup.html
          grep -q 'gifts-mockup-profile-deleted' mockup.html
          grep -q 'gifts-mockup-profile-registry-deleted' editor.html
          grep -q 'async function deleteRegistry' save-profile.html
          grep -q 'const action=decoded?.action==="delete"?"delete":"save"' save-profile.html
          grep -q 'BRIDGE_MODE' save-profile.html
          grep -q 'gifts-mockup-git-token-required' save-profile.html
          grep -q 'gifts-mockup-git-bridge-ready' save-profile.html
          grep -q 'handleGitBridgeMessage' mockup.html
          grep -q 'id="gitTokenPrompt"' mockup.html
          grep -q 'requestGitTokenInline' mockup.html
          grep -q 'requestGitBridgeMutation(pending.action,pending.profile,{token})' mockup.html
          grep -q 'const suppliedToken=String(data.token||"").trim()' save-profile.html
          if grep -q 'window.open(PROFILE_SAVE_URL' mockup.html; then echo "Mockup Lab must not open the Git save window"; exit 1; fi
          if grep -q 'id="saveToGit"' mockup.html; then echo "Git bind action must stay in photo section"; exit 1; fi
          if grep -q 'id="removeMapping"' mockup.html; then echo "Git unbind action must stay in photo section"; exit 1; fi
          grep -q 'Both filled fields must become mockup export targets' tests/logo-preflight-browser.mjs
          grep -q 'editorEligible=!!state?.templateReady&&Number(state.templateFieldCount)>0' editor.html
          grep -q 'templateButtons=.*mockupModeButton' editor.html
          if grep -q 'logoButtons=.*mockupModeButton' editor.html; then echo "Mockup Lab button must not depend on logo readiness"; exit 1; fi
          grep -q 'mappingReady=photoReady&&templateReady' mockup.html
          if grep -q 'if(!state.artwork)return "Сначала загрузите логотип"' mockup.html; then echo "Field photo mapping must not require artwork"; exit 1; fi
          grep -q 'Mockup Lab handoff must expose template fields before a logo is added' tests/logo-preflight-browser.mjs
          grep -q 'window.gwbRefreshEditorState=function' tools/patch-artwork-preflight.mjs
          grep -q 'gwb-editor-readiness-changed' editor.html
          grep -q 'window.gwbGetEditorReadiness=function' tools/patch-artwork-preflight.mjs
          grep -q 'hasRenderedPage=/^Страница' editor.html
          if grep -q 'empty.hidden===true' editor.html; then echo "stale template readiness dependency"; exit 1; fi
          grep -q 'id="photoProgress"' mockup.html
          grep -q 'id="templateProgress"' mockup.html
          grep -q 'id="artworkProgress"' mockup.html
          grep -q 'mockup-map-badge' editor.html
          grep -q 'decorateMockupMappingBadges' editor.html
          grep -q 'data-mockup-mapped' editor.html
          grep -q 'dataset.article=String(t.article' assets/index-BpU9kvz8.js
          grep -q 'updateAssetReadiness' mockup.html
          grep -q 'compactDetailSummary' assets/logo-detail-check.mjs
          grep -q 'PrintCheck-control-circle-v13-morph-open' assets/logo-detail-engine.mjs
          grep -q 'transitionLayer' assets/logo-detail-engine.mjs
          grep -q 'sourcePalette' assets/logo-detail-check.mjs
          grep -q 'Antialias colour boundary is blocked' tests/logo-detail.test.mjs
          grep -q 'Circle probe finds a real narrow white channel even when the ink is one connected object' tests/logo-detail.test.mjs
          grep -q 'Positive scan does not flag the cap of a thick stroke' tests/logo-detail.test.mjs
          grep -q 'Raster scan never upsamples beyond source pixels' tests/logo-detail.test.mjs
          grep -q 'Automatic mask detects light opaque background' tests/logo-detail.test.mjs
          grep -q 'Control-circle positive scan ignores a line wider' tests/logo-detail.test.mjs
          grep -q 'Isolated detection does not split one multicolour visible object' tests/logo-detail.test.mjs
          ! grep -q 'id="detailMode"' assets/logo-detail-check.mjs
          ! grep -q 'id="detailThreshold"' assets/logo-detail-check.mjs
          grep -q 'Маска и фон определяются автоматически' assets/logo-detail-check.mjs
          grep -q 'morphological control-circle scan' tests/logo-detail-browser.mjs
          grep -q 'automatic mask + raster/vector parity' tests/logo-detail-browser.mjs
          grep -q 'true-gap-only negative scan' tests/logo-detail-browser.mjs
          grep -q "overlay:true" assets/logo-detail-check.mjs
          grep -Fq "displayText:e.state==='error'?e.error:'поиск мелких элементов...'" assets/logo-detail-check.mjs
          grep -Fq "transient:e.state!=='error'" assets/logo-detail-check.mjs
          grep -q "f.overlay===true" assets/logo-preflight.mjs
          grep -q "logo-detail-check.mjs?v=20261006-8" assets/logo-preflight.mjs
          grep -q "li.manual" assets/index-CdEUuUA7.css
          grep -q "displayText:f.displayText||f.text" tools/patch-artwork-preflight.mjs
          grep -q "logo-detail-check.mjs?v=20261006-8" tools/patch-artwork-preflight.mjs
          grep -q "logo-preflight.mjs?v=20261006-8" tools/patch-artwork-preflight.mjs
          grep -q 'hasMockupBadge' .github/workflows/test-direct-workbench.yml
          grep -q 'gifts-layout-workbench-mockups/assets/logo-preflight.mjs?v=20261006-8' tests/logo-preflight-browser.mjs
          grep -q 'id="selectField" disabled' mockup.html
          grep -q 'localStorage.getItem(TOKEN_KEY)' save-profile.html
          grep -q 'authMustBeReplaced' save-profile.html
          grep -q 'github-authentication-token-expiration' save-profile.html
          grep -q 'Забыть токен' save-profile.html
          grep -q 'LEGACY_SESSION_KEY' save-profile.html
          if grep -q 'sessionStorage.setItem' save-profile.html; then
            echo "save-profile.html must not store active token only in sessionStorage" >&2
            exit 1
          fi

  publish:
    needs: precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
      - name: Build independent launcher
        run: node source/tools/build-launcher.mjs
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0
      - name: Publish independent Maketnaya with Mockups
        run: |
          set -euo pipefail
          rm -rf site/gifts-layout-workbench-mockups
          mkdir -p site/gifts-layout-workbench-mockups
          cp source/index.html site/gifts-layout-workbench-mockups/index.html
          cp source/editor.html site/gifts-layout-workbench-mockups/editor.html
          cp source/mockup.html site/gifts-layout-workbench-mockups/mockup.html
          cp source/save-profile.html site/gifts-layout-workbench-mockups/save-profile.html
          cp source/mockup-profiles.json site/gifts-layout-workbench-mockups/mockup-profiles.json
          cp source/direct-mode.js site/gifts-layout-workbench-mockups/direct-mode.js
          cp source/launcher.js site/gifts-layout-workbench-mockups/launcher.js
          # Keep the historic bookmark URL working: old bookmarks load the current launcher too.
          mkdir -p site/gifts-layout-workbench
          cp source/launcher.js site/gifts-layout-workbench/launcher.js
          cp -R source/assets site/gifts-layout-workbench-mockups/assets
          cp -R source/vendor site/gifts-layout-workbench-mockups/vendor
      - name: Commit GitHub Pages
        run: |
          set -euo pipefail
          cd site
          git config user.name "maketnaya-mockups-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A gifts-layout-workbench-mockups gifts-layout-workbench/launcher.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish independent Maketnaya with Mockups"
            git push origin main
          fi

  browser_verify:
    needs: publish
    uses: ./.github/workflows/test-direct-workbench.yml
