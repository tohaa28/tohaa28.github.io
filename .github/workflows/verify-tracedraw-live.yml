name: Verify live TraceDraw WASM
on:
  push:
    branches: [gifts-layout-workbench-mockups-source]
    paths:
      - tests/tracedraw-runtime-browser.mjs
      - tests/tracedraw-raster-cmyk-runtime.mjs
      - .github/workflows/verify-tracedraw-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live_trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify real Rust/WASM editing and return to Maketnaya
        run: node tests/tracedraw-runtime-browser.mjs
      - name: Verify real raster CMYK menu, PDF samples and undo
        run: node tests/tracedraw-raster-cmyk-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracedraw-raster-cmyk-screenshot
          path: test-results/tracedraw-raster-cmyk.png
          if-no-files-found: ignore
