name: Publish isolated PrintCheck Vision preview

on:
  push:
    branches:
      - feature/printcheck-vision-copy-v01
    paths:
      - editor.html
      - index.html
      - vision-studio.html
      - vision-review.html
      - vision-ai.html
      - vision-vector.html
      - vision-local-orders.html
      - vision/orders/row-scanner.mjs
      - vision/orders/overlay-entry.mjs
      - tests/printcheck-vision-local-orders.test.mjs
      - tests/printcheck-vision-local-orders.browser.mjs
      - vision/geometry/svg-local-vector.mjs
      - vision/geometry/svg-ink-forms.mjs
      - vision/geometry/svg-dom-vector-bridge.mjs
      - vision/geometry/svg-viewport.mjs
      - vision/geometry/svg-path-subset.mjs
      - vision/geometry/vector-corridors.mjs
      - vision/geometry/curved-normal-probes.mjs
      - tests/printcheck-vision-vector.browser.mjs
      - vision/ai/synthetic-feature-model.mjs
      - vision/ai/scan-worker.mjs
      - tests/printcheck-vision-worker.test.mjs
      - tests/printcheck-vision-ai.browser.mjs
      - vision/dataset/review-task.mjs
      - tests/printcheck-vision-review.browser.mjs
      - tests/printcheck-vision-studio.browser.mjs
      - assets/printcheck-vision-ui.*
      - tools/build-launcher.mjs
      - tests/printcheck-vision-ui.browser.mjs
      - tests/printcheck-vision-session-launch.browser.mjs
      - .github/workflows/publish-printcheck-vision-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: isolated-printcheck-vision-preview
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/feature/printcheck-vision-copy-v01'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout experimental source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation
        run: |
          set -euo pipefail
          node --check assets/printcheck-vision-ui.js
          node --check tests/printcheck-vision-ui.browser.mjs
          node --check tests/printcheck-vision-session-launch.browser.mjs
          node --check vision/dataset/review-task.mjs
          node --check tests/printcheck-vision-studio.browser.mjs
          node --check tests/printcheck-vision-review.browser.mjs
          node --check vision/ai/synthetic-feature-model.mjs
          node --check vision/ai/scan-worker.mjs
          node --test tests/printcheck-vision-worker.test.mjs
          node --check tests/printcheck-vision-ai.browser.mjs
          node --check vision/geometry/svg-local-vector.mjs
          node --check vision/geometry/svg-ink-forms.mjs
          node --check vision/geometry/svg-dom-vector-bridge.mjs
          node --check tests/printcheck-vision-vector.browser.mjs
          node --check vision/orders/row-scanner.mjs
          node --check vision/orders/overlay-entry.mjs
          node --check tests/printcheck-vision-local-orders.browser.mjs
          node --test tests/printcheck-vision-local-orders.test.mjs
          node --test tests/printcheck-vision-synthetic-ai.test.mjs
          node --check direct-mode.js
          node --check assets/index-BpU9kvz8.js

      - name: Browser smoke test (no customer data)
        run: |
          set -euo pipefail
          npm install --no-save playwright esbuild@0.25.12
          npx esbuild vision/orders/overlay-entry.mjs --bundle --platform=browser --format=iife --target=es2022 --outfile=vision-order-overlay.js
          test -s vision-order-overlay.js
          node --check vision-order-overlay.js
          npx playwright install --with-deps chromium
          node tests/printcheck-vision-ui.browser.mjs
          node tests/printcheck-vision-studio.browser.mjs
          node tests/printcheck-vision-review.browser.mjs
          node tests/printcheck-vision-ai.browser.mjs
          node tests/printcheck-vision-vector.browser.mjs
          node tests/printcheck-vision-local-orders.browser.mjs

      - name: Build isolated bookmarklet launcher
        env:
          WORKBENCH_BASE: https://tohaa28.github.io/gifts-layout-workbench-vision/
        run: |
          set -euo pipefail
          node tools/build-launcher.mjs
          test -s launcher.js
          node --check launcher.js

      - name: Verify Vision bookmarklet on a synthetic authorized Gifts session
        run: |
          set -euo pipefail
          node tests/printcheck-vision-session-launch.browser.mjs

      - name: Checkout GitHub Pages site (production files preserved)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Assemble preview under isolated URL
        run: |
          set -euo pipefail
          PREVIEW="site/gifts-layout-workbench-vision"
          mkdir -p "$PREVIEW"
          cp index.html editor.html direct-mode.js launcher.js "$PREVIEW/"
          cp vision-studio.html "$PREVIEW/"
          cp vision-review.html "$PREVIEW/"
          cp vision-ai.html "$PREVIEW/"
          cp vision-vector.html "$PREVIEW/"
          cp vision-local-orders.html vision-order-overlay.js "$PREVIEW/"
          mkdir -p "$PREVIEW/vision/geometry"
          for module in svg-local-vector svg-ink-forms svg-dom-vector-bridge svg-viewport svg-path-subset vector-corridors curved-normal-probes; do
            cp "vision/geometry/$module.mjs" "$PREVIEW/vision/geometry/"
          done
          mkdir -p "$PREVIEW/vision/ai"
          cp vision/ai/synthetic-feature-model.mjs "$PREVIEW/vision/ai/"
          cp vision/ai/scan-worker.mjs "$PREVIEW/vision/ai/"
          mkdir -p "$PREVIEW/vision/dataset"
          cp vision/dataset/review-task.mjs "$PREVIEW/vision/dataset/"
          cp -R assets vendor "$PREVIEW/"
          if test -f mockup.html; then cp mockup.html "$PREVIEW/"; fi
          for json in *.json; do
            if test -f "$json"; then cp "$json" "$PREVIEW/"; fi
          done
          test -f "$PREVIEW/assets/printcheck-vision-ui.js"
          test -f "$PREVIEW/assets/printcheck-vision-ui.css"
          test -f "$PREVIEW/launcher.js"
          test -f "$PREVIEW/vision/ai/synthetic-feature-model.mjs"
          test -f "$PREVIEW/vision/ai/scan-worker.mjs"
          test -f "$PREVIEW/vision-ai.html"
          test -f "$PREVIEW/vision-vector.html"
          test -f "$PREVIEW/vision-local-orders.html"
          test -s "$PREVIEW/vision-order-overlay.js"
          test -f "$PREVIEW/vision/geometry/svg-local-vector.mjs"
          test -f "$PREVIEW/vision/geometry/svg-ink-forms.mjs"
          test -f "$PREVIEW/vision/geometry/vector-corridors.mjs"
          grep -q 'gifts-layout-workbench-vision' "$PREVIEW/launcher.js"
          echo "Preview isolated at /gifts-layout-workbench-vision/"

      - name: Commit only the new preview folder
        run: |
          set -euo pipefail
          cd site
          git config user.name "printcheck-vision-preview"
          git config user.email "actions@users.noreply.github.com"
          git add -A gifts-layout-workbench-vision
          if git diff --cached --quiet; then
            echo "Preview already current"
            exit 0
          fi
          git commit -m "Publish isolated PrintCheck Vision preview"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to publish preview after retries" >&2
          exit 1
