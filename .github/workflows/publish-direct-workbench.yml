name: Publish direct Gifts Workbench

on:
  push:
    branches:
      - gifts-layout-workbench-source
    paths:
      - "index.html"
      - "editor.html"
      - "direct-mode.js"
      - "tools/build-launcher.mjs"
      - "assets/**"
      - "vendor/**"
      - ".github/workflows/publish-direct-workbench.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gifts-layout-workbench-source
          path: source
          fetch-depth: 0

      - name: Build direct launcher
        run: |
          set -euo pipefail
          node source/tools/build-launcher.mjs
          test -f source/launcher.js
          node --check source/direct-mode.js
          node --check source/launcher.js

      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0

      - name: Publish static direct mode
        run: |
          set -euo pipefail
          rm -rf site/gifts-layout-workbench
          mkdir -p site/gifts-layout-workbench
          cp source/index.html site/gifts-layout-workbench/index.html
          cp source/editor.html site/gifts-layout-workbench/editor.html
          cp source/direct-mode.js site/gifts-layout-workbench/direct-mode.js
          cp source/launcher.js site/gifts-layout-workbench/launcher.js
          cp -R source/assets site/gifts-layout-workbench/assets
          cp -R source/vendor site/gifts-layout-workbench/vendor

      - name: Commit GitHub Pages
        run: |
          set -euo pipefail
          cd site
          git config user.name "workbench-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A gifts-layout-workbench
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish direct Gifts Workbench"
            git push origin main
          fi
