name: Print central Saint Petersburg A3 map
on:
  push:
    branches: [spb-a3-print-map]
    paths:
      - "spb-map/build.py"
      - ".github/workflows/build-spb-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spb-a3-print-map
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check requests reportlab osmium pypdf
      - name: Render vector map PDF
        working-directory: spb-map
        env:
          MAP_OUTPUT: Saint_Petersburg_Center_A3_Map.pdf
        run: python build.py
      - name: Verify PDF and page count
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          r=PdfReader("spb-map/Saint_Petersburg_Center_A3_Map.pdf")
          assert len(r.pages)==13, f"Expected 13 A3 pages, got {len(r.pages)}"
          for i,p in enumerate(r.pages):
              w,h=float(p.mediabox.width),float(p.mediabox.height)
              assert 840 < w < 843 and 1189 < h < 1192,(i,w,h)
          print("Verified 13 pages, all A3 portrait")
          PY
      - name: Upload finished PDF
        uses: actions/upload-artifact@v4
        with:
          name: spb-center-map-A3-13-pages
          path: spb-map/Saint_Petersburg_Center_A3_Map.pdf
          retention-days: 30
      - name: Publish ready-to-download PDF to separate branch
        run: |
          mkdir -p spb-map/output
          cp spb-map/Saint_Petersburg_Center_A3_Map.pdf spb-map/output/Saint_Petersburg_Center_A3_Map.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spb-map/output/Saint_Petersburg_Center_A3_Map.pdf
          git commit -m "Publish printable A3 Saint Petersburg map [skip ci]" || exit 0
          git push origin HEAD:spb-a3-print-map
