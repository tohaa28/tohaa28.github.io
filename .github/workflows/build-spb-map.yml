name: Print central Saint Petersburg A3 map
on:
  push:
    branches: [spb-a3-print-map]
    paths:
      - "spb-map/build_spb_map.py.gz.b64"
      - ".github/workflows/build-spb-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spb-a3-print-map
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check requests reportlab
      - name: Restore generator and verify its hash
        run: |
          python - <<'PY'
          import gzip, base64, pathlib, hashlib
          p=pathlib.Path('spb-map/build_spb_map.py.gz.b64')
          out=pathlib.Path('spb-map/build_spb_map.py')
          b=gzip.decompress(base64.b64decode(p.read_text().strip()))
          digest=hashlib.sha256(b).hexdigest()
          print('Map script SHA256:',digest)
          assert digest=='3f85cae8ed854447613973db405dc41d9205f46bf268d38bac145e91b4c935ee','Source transfer checksum mismatch'
          out.write_bytes(b)
          PY
      - name: Render vector map PDF
        working-directory: spb-map
        env:
          MAP_OUTPUT: Saint_Petersburg_Center_A3_Map.pdf
        run: python build_spb_map.py
      - name: Verify PDF and page count
        run: |
          pdfinfo spb-map/Saint_Petersburg_Center_A3_Map.pdf | head -25
          test "$(pdfinfo spb-map/Saint_Petersburg_Center_A3_Map.pdf | awk '/Pages:/ {print $2}')" = 13
      - name: Upload finished PDF
        uses: actions/upload-artifact@v4
        with:
          name: spb-center-map-A3-13-pages
          path: spb-map/Saint_Petersburg_Center_A3_Map.pdf
          retention-days: 30
      - name: Publish ready-to-download PDF to separate branch
        run: |
          mkdir -p spb-map/output
          cp spb-map/Saint_Petersburg_Center_A3_Map.pdf spb-map/output/Saint_Petersburg_Center_A3_Map.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spb-map/output/Saint_Petersburg_Center_A3_Map.pdf
          git commit -m "Publish printable A3 Saint Petersburg map [skip ci]" || exit 0
          git push origin HEAD:spb-a3-print-map
