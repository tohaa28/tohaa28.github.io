          await fullCardClickTarget.hover();
          await frame.waitForFunction(()=>{
            const card=document.querySelector("#basketOrders .basket-order");
            return card?.dataset.gwbExpanded==="true"&&!card.querySelector(".gwb-order-extra")?.inert;
          },null,{timeout:3000});
          await secondArticle.click();
          await frame.waitForFunction(()=>document.getElementById("order")?.value==="7920509");
          if ((await frame.locator("#order").inputValue()) !== "7920509") {
            throw new Error("Clicking article area inside order frame did not open the order");
          }
          // Article click above already opens this order; the basket is now hidden.
          try {
            await frame.waitForSelector("#orderEditor:not([hidden])", {timeout:30000});
          } catch (error) {
            const orderOpenDiagnostics = await frame.evaluate(() => ({
              status: document.getElementById("status")?.textContent || "",
              progress: document.getElementById("orderProgressText")?.textContent || "",
              orderLoadingHidden: document.getElementById("orderLoading")?.hidden,
              orderStepHidden: document.getElementById("orderStep")?.hidden,
              orderStep: document.getElementById("orderStep")?.textContent || "",
              orderEditorHidden: document.getElementById("orderEditor")?.hidden,
              articleCards: document.querySelectorAll("#orderTemplateList .article-choice").length,
              templateName: document.getElementById("templateName")?.textContent || ""
            }));
            throw new Error("Order editor did not open: "+JSON.stringify({orderOpenDiagnostics,errors,error:String(error)}));
          }
          await frame.waitForSelector("#orderTemplateList .article-choice", {state:"attached", timeout:30000});
          await frame.waitForFunction(() => document.getElementById("orderFieldChoiceBox")?.hidden === false, null, {timeout:30000});
          const openWorkspaceState = await frame.evaluate(() => ({
            orderEditorHidden:document.getElementById("orderEditor")?.hidden,
            waitingHidden:document.getElementById("orderWaitingWorkspace")?.hidden,
            orderState:document.querySelector(".workspace")?.dataset.orderState || ""
          }));
          await frame.waitForTimeout(590);
          const openedPanel=await frame.evaluate(()=>{const main=document.querySelector(".app>main"),rail=main?.querySelector(":scope>.rail"),workspace=main?.querySelector(":scope>.workspace");return {expanded:main?.classList.contains("gwb-orders-full"),mainWidth:main?.getBoundingClientRect().width,railWidth:rail?.getBoundingClientRect().width,workspaceWidth:workspace?.getBoundingClientRect().width};});
          if(openedPanel.expanded||openedPanel.railWidth>openedPanel.mainWidth*.65||openedPanel.workspaceWidth<openedPanel.mainWidth*.25)
            throw Error("Order-opening panel animation did not restore the editor: "+JSON.stringify(openedPanel));
          if (openWorkspaceState.orderEditorHidden !== false || openWorkspaceState.waitingHidden !== true || openWorkspaceState.orderState !== "open") {
            throw new Error("Workspace did not leave waiting mode after opening order: "+JSON.stringify(openWorkspaceState));
          }
          await frame.evaluate(() => {
            const overlay=document.getElementById("overlay"),stage=document.getElementById("stage");
            const ctx=overlay?.getContext("2d");if(ctx){ctx.fillStyle="rgba(255,0,0,1)";ctx.fillRect(0,0,Math.min(20,overlay.width),Math.min(20,overlay.height));}
            let detail=document.getElementById("detailOverlay");
            if(!detail&&stage){detail=document.createElement("canvas");detail.id="detailOverlay";detail.width=Math.max(1,overlay?.width||20);detail.height=Math.max(1,overlay?.height||20);stage.append(detail);}
            const dctx=detail?.getContext("2d");if(dctx){dctx.fillStyle="rgba(0,0,255,1)";dctx.fillRect(0,0,20,20);}
            let errors=document.getElementById("logoErrorOverlay");
            if(!errors){errors=document.createElement("aside");errors.id="logoErrorOverlay";document.querySelector(".workspace")?.append(errors);}
            errors.hidden=false;errors.textContent="Старый PrintCheck";
          });
          await frame.locator("#backToOrders").click();
          await frame.waitForFunction(() => document.getElementById("orderWaitingWorkspace")?.hidden === false && document.getElementById("orderEditor")?.hidden === true, null, {timeout:10000});
          const waitingWorkspaceState = await frame.evaluate(() => {
            const workspace=document.querySelector(".workspace"),waiting=document.getElementById("orderWaitingWorkspace"),stage=document.getElementById("stageScroll"),resume=document.getElementById("resumeEditor");
            const alphaSum=id=>{
              const canvas=document.getElementById(id);if(!canvas?.getContext)return -1;
              const data=canvas.getContext("2d").getImageData(0,0,canvas.width,canvas.height).data;let sum=0;
              for(let i=3;i<data.length;i+=4)sum+=data[i];
              return sum;
            };
            const logoError=document.getElementById("logoErrorOverlay");
            return {
              text:waiting?.textContent?.replace(/\s+/g," ").trim()||"",
              orderState:workspace?.dataset.orderState||"",
              artworkVisualState:workspace?.dataset.artworkVisualState||"",
              stageVisibility:stage?getComputedStyle(stage).visibility:"",
              overlayVisibility:getComputedStyle(document.getElementById("overlay")).visibility,
              detailVisibility:document.getElementById("detailOverlay")?getComputedStyle(document.getElementById("detailOverlay")).visibility:"",
              overlayAlpha:alphaSum("overlay"),
              detailAlpha:alphaSum("detailOverlay"),
              errorOverlayHidden:logoError?.hidden===true,
              resumeHidden:resume?.hidden
            };
          });
          if (!/Ожидание выбора заказа/.test(waitingWorkspaceState.text) ||
              waitingWorkspaceState.orderState !== "waiting" ||
              waitingWorkspaceState.artworkVisualState !== "unloaded" ||
              waitingWorkspaceState.stageVisibility !== "hidden" ||
              waitingWorkspaceState.overlayVisibility !== "hidden" ||
              waitingWorkspaceState.detailVisibility !== "hidden" ||
              waitingWorkspaceState.overlayAlpha !== 0 ||
              waitingWorkspaceState.detailAlpha !== 0 ||
              waitingWorkspaceState.errorOverlayHidden !== true ||
              waitingWorkspaceState.resumeHidden !== false) {
            throw new Error("Returning to order list did not clear the right workspace: "+JSON.stringify(waitingWorkspaceState));
          }
          await frame.locator("#resumeEditor").click();
          await frame.waitForFunction(() => document.getElementById("orderWaitingWorkspace")?.hidden === true && document.getElementById("orderEditor")?.hidden === false, null, {timeout:10000});
          const resumedArtworkLayerState=await frame.evaluate(()=>({
            artworkVisualState:document.querySelector(".workspace")?.dataset.artworkVisualState||"",
            overlayVisibility:getComputedStyle(document.getElementById("overlay")).visibility
          }));
          if(resumedArtworkLayerState.artworkVisualState!=="active"||resumedArtworkLayerState.overlayVisibility==="hidden"){
            throw new Error("Artwork layers were not restored after returning to order: "+JSON.stringify(resumedArtworkLayerState));
          }
          console.log("Order-list workspace waiting state:", JSON.stringify(waitingWorkspaceState));
          await frame.waitForFunction(() => {
            const img = document.querySelector("#orderTemplateList .article-thumb");
            return !!img && img.hidden === false && img.complete && img.naturalWidth > 0;
          }, null, {timeout:30000});

          await frame.evaluate(() => window.gwbFlow?.go(1));
          const articleChoiceState = await frame.evaluate(() => {
            const choice = document.querySelector("#orderTemplateList .article-choice");
            const info = choice?.querySelector(".article-choice-info");
            const summary = document.getElementById("orderTemplateSummary");
            const mockupBadge=choice?.querySelector(".mockup-map-badge");
            const quantityRow=[...(choice?.querySelectorAll(".article-row")||[])].find(row=>row.querySelector(".detail-key")?.textContent?.trim()==="Тираж");
            const quantityValue=quantityRow?.querySelector(".detail-value");
            const badgeOverlapsQuantity=(()=>{
              if(!mockupBadge||!quantityValue)return false;
              const a=mockupBadge.getBoundingClientRect(),b=quantityValue.getBoundingClientRect();
              return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
            })();
            const rows = {};
            for (const row of choice?.querySelectorAll(".article-row") || []) {
              const key = row.querySelector(".detail-key")?.textContent?.trim();
              const value = row.querySelector(".detail-value")?.textContent?.trim();
              if (key) rows[key] = value || "";
            }
            const detailLabel=choice?.querySelector(".article-row .detail-key");
            const detailValue=choice?.querySelector(".article-row .detail-value");
            const detailRow=choice?.querySelector(".article-row");
            const thumb=choice?.querySelector(".article-thumb-wrap");
            const detailStyling={
              labelSize:parseFloat(getComputedStyle(detailLabel).fontSize),
              labelWeight:Number(getComputedStyle(detailLabel).fontWeight),
              valueSize:parseFloat(getComputedStyle(detailValue).fontSize),
              valueWeight:Number(getComputedStyle(detailValue).fontWeight),
              thumbWidth:thumb.getBoundingClientRect().width,
              rowColumns:getComputedStyle(detailRow).gridTemplateColumns
            };
            const articleContainer=choice?.closest(".article-card");
            const picker=document.getElementById("orderTemplatePicker");
            const borders={
              outer:articleContainer?parseFloat(getComputedStyle(articleContainer).borderTopWidth):0,
              inner:picker?parseFloat(getComputedStyle(picker).borderTopWidth):-1,
              innerShadow:picker?getComputedStyle(picker).boxShadow:"unknown"
            };
            const badgeContent = choice ? getComputedStyle(choice, "::after").content : "";
            return {
              choiceExists: !!choice,
              previewInsideChoice: !!choice?.querySelector(".article-thumb-wrap .article-thumb"),
              previewSrc: choice?.querySelector(".article-thumb")?.getAttribute("src") || "",
              previewLoaded: (() => { const img=choice?.querySelector(".article-thumb"); return !!img && !img.hidden && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0; })(),
              redundantSummaryHidden: !!summary && getComputedStyle(summary).display === "none",
              badgeRemoved: !/Выбрано/.test(badgeContent || ""),
              hasMockupBadge: !!mockupBadge,
              badgeOverlapsQuantity,
              selectedPaddingRight: choice ? parseFloat(getComputedStyle(choice).paddingRight) : 999,
              infoPaddingRight: info ? parseFloat(getComputedStyle(info).paddingRight) : 999,
              rows,
              detailStyling,
              borders,
              legacySeparateBlocks: ["selectedArticleBody","orderDetails","productCard"].some(id => !!document.getElementById(id))
            };
          });
          if (!articleChoiceState.choiceExists ||
              !articleChoiceState.previewInsideChoice ||
              !articleChoiceState.previewLoaded ||
              !articleChoiceState.redundantSummaryHidden ||
              !articleChoiceState.badgeRemoved ||
              articleChoiceState.selectedPaddingRight > (articleChoiceState.hasMockupBadge ? 32 : 20) ||
              articleChoiceState.infoPaddingRight > 4 ||
              articleChoiceState.badgeOverlapsQuantity ||
              articleChoiceState.legacySeparateBlocks ||
              articleChoiceState.borders.outer<1.5 ||
              articleChoiceState.borders.inner!==0 ||
              articleChoiceState.borders.innerShadow!=="none" ||
              articleChoiceState.detailStyling.valueWeight>500 ||
              articleChoiceState.detailStyling.labelWeight>500 ||
              Math.abs(articleChoiceState.detailStyling.valueSize-10)>0.1 ||
              Math.abs(articleChoiceState.detailStyling.labelSize-10)>0.1 ||
              articleChoiceState.detailStyling.thumbWidth>80 ||
              articleChoiceState.rows["Артикул"] !== "15637" ||
              articleChoiceState.rows["Название"] !== "Брелок" ||
              articleChoiceState.rows["Тираж"] !== "10 шт." ||
              !/Лазерная гравировка/.test(articleChoiceState.rows["Нанесение"] || "") ||
              articleChoiceState.rows["Место"] !== "лицо" ||
              articleChoiceState.rows["Контроль мест"] !== undefined ||
              articleChoiceState.rows["Подписи PDF"] !== undefined) {
            throw new Error("Integrated article choice is invalid: "+JSON.stringify(articleChoiceState));
          }
          console.log("Integrated article choice:", JSON.stringify(articleChoiceState));
          const fieldPlaceMapping = await frame.evaluate(() =>
            [...document.querySelectorAll("#orderFieldChoice option")].map(x => x.textContent || "")
          );
          if (!fieldPlaceMapping.some(text => /лицо/i.test(text))) {
            throw new Error("Order place was not mapped onto detected template field: "+JSON.stringify(fieldPlaceMapping));
          }
          console.log("Mapped field names:", JSON.stringify(fieldPlaceMapping));

          const stageAspect = await frame.evaluate(() => {
            const stage = document.getElementById("stage");
            const canvas = document.getElementById("templateCanvas");
            const box = stage?.getBoundingClientRect();
            return {
              cssWidth: box?.width || 0,
              cssHeight: box?.height || 0,
              cssRatio: box?.height ? box.width / box.height : 0,
              canvasWidth: canvas?.width || 0,
              canvasHeight: canvas?.height || 0,
              canvasRatio: canvas?.height ? canvas.width / canvas.height : 0,
              minWidth: stage?.style.minWidth || ""
            };
          });
          const stageRatioError = stageAspect.canvasRatio
            ? Math.abs(stageAspect.cssRatio / stageAspect.canvasRatio - 1)
            : 1;
          if (!(stageAspect.cssWidth > 0) || !(stageAspect.cssHeight > 0) ||
              stageRatioError > 0.01 || stageAspect.minWidth !== "0px") {
            throw new Error("Stage aspect ratio is not preserved: "+JSON.stringify({stageAspect,stageRatioError}));
          }
          console.log("Stage aspect ratio:", JSON.stringify({...stageAspect,stageRatioError}));

          await frame.evaluate(() => window.gwbFlow?.go(2));
          const fieldOptionCount = await frame.locator("#orderFieldChoice option:not([value=''])").count();
          if (fieldOptionCount > 0) {
            await frame.selectOption("#orderFieldChoice", {index:1});
            await frame.waitForFunction(() => {
              const step3 = document.getElementById("editorStep3");
              return step3 && step3.hidden === false;
            }, null, {timeout:30000});
            await frame.waitForTimeout(100);
            const fieldStage = await frame.evaluate(() => {
              const stage = document.getElementById("stage");
              const template = document.getElementById("templateCanvas");
              const overlay = document.getElementById("overlay");
              const stageBox = stage.getBoundingClientRect();
              const templateBox = template.getBoundingClientRect();
              const overlayBox = overlay.getBoundingClientRect();
              const num = value => Number.parseFloat(value || "0") || 0;
              return {
                stage:{w:stageBox.width,h:stageBox.height,styleW:stage.style.width,styleH:stage.style.height,minW:stage.style.minWidth,maxW:getComputedStyle(stage).maxWidth,maxH:getComputedStyle(stage).maxHeight},
                template:{w:templateBox.width,h:templateBox.height,pixelW:template.width,pixelH:template.height,cssW:getComputedStyle(template).width,cssH:getComputedStyle(template).height},
                overlay:{w:overlayBox.width,h:overlayBox.height,pixelW:overlay.width,pixelH:overlay.height,cssW:getComputedStyle(overlay).width,cssH:getComputedStyle(overlay).height},
                scroll:{w:document.getElementById("stageScroll").clientWidth,h:document.getElementById("stageScroll").clientHeight},
                ratios:{
                  stage:stageBox.height?stageBox.width/stageBox.height:0,
                  templateCss:templateBox.height?templateBox.width/templateBox.height:0,
                  templatePixels:template.height?template.width/template.height:0,
                  overlayCss:overlayBox.height?overlayBox.width/overlayBox.height:0,
                  overlayPixels:overlay.height?overlay.width/overlay.height:0
                }
              };
            });
            console.log("Field stage diagnostics:", JSON.stringify(fieldStage));
            const renderedFieldPixels = await frame.evaluate(() => {
              const canvas = document.getElementById("templateCanvas");
              const ctx = canvas.getContext("2d", {willReadFrequently:true});
              const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
              let minX=canvas.width, minY=canvas.height, maxX=-1, maxY=-1, count=0;
              for (let y=0; y<canvas.height; y++) {
                for (let x=0; x<canvas.width; x++) {
                  const p=(y*canvas.width+x)*4;
                  const r=data[p], g=data[p+1], b=data[p+2], a=data[p+3];
                  if (a > 80 && b > 120 && g > 70 && r < 100 && b > r + 50) {
                    minX=Math.min(minX,x); minY=Math.min(minY,y);
                    maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); count++;
                  }
                }
              }
              const w=maxX>=minX?maxX-minX+1:0;
              const h=maxY>=minY?maxY-minY+1:0;
              return {minX,minY,maxX,maxY,w,h,count,ratio:h?w/h:0};
            });
            console.log("Rendered field pixels:", JSON.stringify(renderedFieldPixels));
            if (renderedFieldPixels.count < 20 || Math.abs(renderedFieldPixels.ratio - 1) > 0.02) {
              throw new Error("Rendered square field is distorted after zoom: "+JSON.stringify(renderedFieldPixels));
            }
            const ratios = fieldStage.ratios;
            const fieldRatioError = Math.max(
              Math.abs(ratios.stage / ratios.templatePixels - 1),
              Math.abs(ratios.templateCss / ratios.templatePixels - 1),
              Math.abs(ratios.overlayCss / ratios.overlayPixels - 1)
            );
            if (!Number.isFinite(fieldRatioError) || fieldRatioError > 0.01) {
              throw new Error("Field view stretches the canvas: "+JSON.stringify({fieldStage,fieldRatioError}));
            }
          }

          await frame.click("#backToOrders");
          await frame.waitForSelector("#orderBrowser:not([hidden])", {timeout:30000});
          await frame.evaluate(() => {
            document.getElementById("order").value = "7920510";
            document.getElementById("loadOrder").click();
          });
          await frame.waitForFunction(() => {
            const loading = document.getElementById("orderLoading");
            const editor = document.getElementById("orderEditor");
            const choice = document.querySelector("#orderTemplateList .article-choice");
            const hint = document.getElementById("fieldChoiceHint");
            return loading?.hidden === true &&
              editor?.hidden === false &&
              choice?.classList.contains("place-count-mismatch") === true &&
              hint?.classList.contains("unmatched") === true &&
              /Не удалось однозначно сопоставить места нанесения/i.test(hint?.textContent || "");
          }, null, {timeout:30000});
          const mismatchState = await frame.evaluate(() => ({
            technicalRows:[...document.querySelectorAll("#orderTemplateList .article-row")].filter(x => {
              const key=x.querySelector(".detail-key")?.textContent?.trim() || "";
              return key==="Контроль мест" || key==="Подписи PDF";
            }).length,
            mismatchClass:document.querySelector("#orderTemplateList .article-choice")?.classList.contains("place-count-mismatch") === true,
            hint:document.getElementById("fieldChoiceHint")?.textContent || "",
            hintUnmatched:document.getElementById("fieldChoiceHint")?.classList.contains("unmatched") === true,
            selectedField:document.getElementById("orderFieldChoice")?.value || "",
            step3Hidden:document.getElementById("editorStep3")?.hidden === true
          }));
          if (mismatchState.technicalRows !== 0 ||
              !mismatchState.mismatchClass || !mismatchState.hintUnmatched ||
              !/Не удалось однозначно сопоставить места нанесения/i.test(mismatchState.hint) ||
              mismatchState.selectedField !== "" || !mismatchState.step3Hidden) {
            throw new Error("Place-count mismatch is not safely handled: "+JSON.stringify(mismatchState));
          }
          console.log("Place-count mismatch control:", JSON.stringify(mismatchState));

          await frame.evaluate(() => window.gwbFlow?.setSettings(true));
          const {verifyPdfLabels} = await import("./tests/pdf-labels-browser.mjs");
          await verifyPdfLabels(frame);
          const {verifyLogoPreflight} = await import("./tests/logo-preflight-browser.mjs");
          await verifyLogoPreflight(frame);
          const {verifyRotationAndColors}=await import('./tests/logo-rotation-browser.mjs');
          await verifyRotationAndColors(frame);
          const {verifyDetailCheck}=await import('./tests/logo-detail-browser.mjs');
          await verifyDetailCheck(frame);
          const {verifyFieldZoom}=await import('./tests/field-zoom-browser.mjs');
          await verifyFieldZoom(frame);
          const {verifyMethodAdmin}=await import('./tests/method-admin-browser.mjs');
          await verifyMethodAdmin(frame);
          const {verifyVectorView}=await import('./tests/vector-view-browser.mjs');
          await verifyVectorView(frame);
          const {verifyMockupCylinder}=await import('./tests/mockup-cylinder-browser.mjs');
          await verifyMockupCylinder(browserContext);
          const {verifyStepMotion} = await import("./tests/step-motion-browser.mjs");
          await verifyStepMotion(frame);
          const pdfWorkerTest = await frame.evaluate(async () => {
            if (!globalThis.PDFLib?.PDFDocument) throw new Error("PDFLib is unavailable");
            if (!globalThis.pdfjsLib?.getDocument) throw new Error("pdfjsLib is unavailable");
            const made = await globalThis.PDFLib.PDFDocument.create();
            made.addPage([144, 72]);
            const bytes = await made.save();
            const loading = globalThis.pdfjsLib.getDocument({
              data: new Uint8Array(bytes),
              isEvalSupported: false,
              useSystemFonts: false
            });
            const pdf = await loading.promise;
            const p = await pdf.getPage(1);
            const viewport = p.getViewport({scale:1});
            await pdf.destroy();
            return {
              pages: pdf.numPages,
              width: viewport.width,
              workerSrc: globalThis.pdfjsLib.GlobalWorkerOptions.workerSrc
            };
          });
          if (pdfWorkerTest.pages !== 1 || !(pdfWorkerTest.width > 0)) {
            throw new Error("PDF worker failed: "+JSON.stringify(pdfWorkerTest));
          }
          console.log("PDF worker test:", JSON.stringify(pdfWorkerTest));
          console.log("Workbench loaded:", title.replace(/\s+/g," "), "session:", JSON.stringify(sessionJson), "basket:", JSON.stringify(basket));
          if (errors.length) console.log("Browser diagnostics:", errors.join(" | "));
          await browser.close();
          NODE
      - name: Save motion-interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maketnaya-step-motion-screenshots
          path: step-motion-*.png
          if-no-files-found: ignore
