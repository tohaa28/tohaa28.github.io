name: Test direct Workbench on gifts.ru

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - gifts-layout-workbench-source
    paths:
      - "direct-mode.js"
      - "editor.html"
      - "tools/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/test-direct-workbench.yml"

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - run: node tools/build-launcher.mjs
      - run: node --check direct-mode.js
      - run: node --check assets/index-BpU9kvz8.js
      - run: npm init -y
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Launch Workbench on gifts.ru
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser = await chromium.launch({headless:true});
          const browserContext = await browser.newContext();
          const page = await browserContext.newPage();
          await browserContext.route("https://tohaa28.github.io/gifts-layout-workbench/**", async route => {
            const pathname = new URL(route.request().url()).pathname;
            const relative = pathname.replace("/gifts-layout-workbench/", "");
            if (!/^(assets|vendor)\//.test(relative) || relative.includes("..")) return route.abort();
            const contentType = /\.m?js$/.test(relative) ? "application/javascript" : /\.css$/.test(relative) ? "text/css" : "application/octet-stream";
            await route.fulfill({body:fs.readFileSync(relative),contentType,headers:{"access-control-allow-origin":"*"}});
          });
          const errors = [];
          page.on("pageerror", e => errors.push("pageerror: "+e.message));
          page.on("console", m => { if (m.type()==="error") errors.push("console: "+m.text()); });
          // Deterministic host shell; order/template requests are independently mocked below.
          // Set WORKBENCH_LIVE_SMOKE=1 to exercise the live host chrome as well.
          if (!process.env.WORKBENCH_LIVE_SMOKE) await page.route("https://gifts.ru/", route => route.fulfill({contentType:"text/html",body:"<!doctype html><html><head><title>Gifts test host</title></head><body><main></main></body></html>"}));
          await page.goto("https://gifts.ru/", {waitUntil:"domcontentloaded", timeout:60000});
          await page.evaluate(() => {
            const a = document.createElement("a");
            a.id = "gwb-test-logout";
            a.href = "/logout";
            a.textContent = "Выйти";
            document.body.appendChild(a);
            const stale = document.createElement("a");
            stale.id = "gwb-stale-order";
            stale.href = "/private/order/1111111";
            stale.textContent = "Заказ 1111111";
            document.body.appendChild(stale);
            window.__gwbBasketFetches = 0; window.__gwbLegacyCartFetches = 0;
          });
          await page.evaluate(() => {
            const realFetch = window.fetch.bind(window);
            window.fetch = (input, init) => {
              const raw = typeof input === "string" ? input : input?.url || String(input);
              const url = new URL(raw, location.href);
              if (url.origin === location.origin && (url.pathname === "/private/orders/basket" || url.pathname === "/private/orders/basket/")) {
                window.__gwbBasketFetches = (window.__gwbBasketFetches || 0) + 1;
                return Promise.resolve(new Response('<!doctype html><html><body><main class="orders-basket"><a href="/private/order/7920509">Заказ 7920509</a><a href="/private/order/7920512">Заказ 7920512</a><div>Архивный текст: Заказ 306190</div><script>window.fake={"orderNumber":"280185"}</script></main></body></html>', {
