name: Test direct Workbench on gifts.ru

on:
  workflow_dispatch:
  push:
    branches:
      - gifts-layout-workbench-source
      - codex/order-place-mapping
    paths:
      - "direct-mode.js"
      - "editor.html"
      - "tools/**"
      - "assets/**"
      - ".github/workflows/test-direct-workbench.yml"

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-launcher.mjs
      - run: node --check assets/index-BpU9kvz8.js
      - run: node --check direct-mode.js
      - run: node tools/test-place-mapping.mjs
      - run: npm init -y
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - name: Launch Workbench on gifts.ru
        run: |
          node --input-type=module - <<'NODE'
          import { chromium } from "playwright";
          import { readFile } from "node:fs/promises";
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          // Serve the checked-out commit, including launcher dependencies, not live Pages.
          await page.route("https://tohaa28.github.io/gifts-layout-workbench/**", async route => {
            const path = new URL(route.request().url()).pathname.replace("/gifts-layout-workbench/","");
            if (!path || path.includes("..")) throw new Error("Unexpected asset path: "+path);
            const type = path.endsWith(".js") ? "application/javascript" : path.endsWith(".css") ? "text/css" : "text/html";
            await route.fulfill({body:await readFile(path),contentType:type,headers:{"access-control-allow-origin":"*"}});
          });
          const errors = [];
          page.on("pageerror", e => errors.push("pageerror: "+e.message));
          page.on("console", m => { if (m.type()==="error") errors.push("console: "+m.text()); });
          await page.goto("https://gifts.ru/", {waitUntil:"domcontentloaded", timeout:60000});
          await page.evaluate(() => {
            const a = document.createElement("a");
            a.id = "gwb-test-logout";
            a.href = "/logout";
            a.textContent = "Выйти";
            document.body.appendChild(a);
            const stale = document.createElement("a");
            stale.id = "gwb-stale-order";
            stale.href = "/private/order/1111111";
            stale.textContent = "Заказ 1111111";
            document.body.appendChild(stale);
            window.__gwbCartFetches = 0;
          });
          await page.evaluate(() => {
            const realFetch = window.fetch.bind(window);
            window.fetch = (input, init) => {
              const raw = typeof input === "string" ? input : input?.url || String(input);
              const url = new URL(raw, location.href);
              if (url.origin === location.origin && (url.pathname === "/cart" || url.pathname === "/cart/")) {
                window.__gwbCartFetches = (window.__gwbCartFetches || 0) + 1;
                return Promise.resolve(new Response('<!doctype html><html><body><a href="/private/order/7920509">Заказ 7920509</a><a href="/private/order/280185">Заказ 280185</a><a href="/private/order/306190">Заказ 306190</a></body></html>', {
                  status: 200,
                  headers: {"content-type":"text/html; charset=utf-8"}
                }));
              }
              if (url.origin === location.origin && window.__gwbScenario &&
                  url.pathname === "/private/order/" + window.__gwbScenario.order) {
                return Promise.resolve(new Response(window.__gwbScenario.html,{headers:{"content-type":"text/html"}}));
              }
              if (url.origin === location.origin && window.__gwbScenario && url.pathname === "/drawing" &&
                  url.searchParams.get("action") === "getOrderItemPdf" && url.searchParams.get("orderitemid") === "32345") {
                const bytes = Uint8Array.from(atob(window.__gwbScenario.pdf), c => c.charCodeAt(0));
                return Promise.resolve(new Response(bytes,{headers:{"content-type":"application/pdf"}}));
              }
              if (url.origin === location.origin && url.pathname === "/private/order/7920509") {
                return Promise.resolve(new Response('<!doctype html><html><body><li data-itemid="12345" data-drawtaskids="999"><div class="cart-tbl-name"><a href="/id/228756">Артикул 15637</a></div><div class="cart-tbl-id"><div class="cart-tbl-lbl">Брелок</div></div><div class="cart-qty">10 шт.</div><div class="cart-tbl-imp"><g-droper><span>LM1: Лазерная гравировка</span></g-droper><div class="flex-center flex-column"><span class="color-text">15637 лицо</span></div></div></li></body></html>', {
                  status: 200,
                  headers: {"content-type":"text/html; charset=utf-8"}
                }));
              }
              if (url.origin === location.origin && url.pathname === "/private/order/7920510") {
                return Promise.resolve(new Response('<!doctype html><html><body><li data-itemid="22345" data-drawtaskids="901,902"><div class="cart-tbl-name"><a href="/id/228757">Артикул 17488</a></div><div class="cart-tbl-id"><div class="cart-tbl-lbl">Тестовый товар</div></div><div class="cart-qty">5 шт.</div><div class="cart-tbl-imp"><g-droper><span>LM1: Лазерная гравировка</span></g-droper><div class="flex-center flex-column"><span class="color-text">17488 лицо</span><span class="color-text">17488 оборот</span></div></div></li></body></html>', {
                  status: 200,
                  headers: {"content-type":"text/html; charset=utf-8"}
                }));
              }
              if (url.origin === location.origin && url.pathname === "/id/228757") {
                return Promise.resolve(new Response('<!doctype html><html><body><h1>Тестовый товар</h1></body></html>', {
                  status: 200,
                  headers: {"content-type":"text/html; charset=utf-8"}
                }));
              }
              if (url.origin === location.origin && url.pathname === "/id/228756") {
                return Promise.resolve(new Response('<!doctype html><html><body><h1>Брелок Tetta</h1><img src="https://files.gifts.ru/reviewer/webp/15/15637_7_500.webp?v=2" alt="Брелок Tetta"></body></html>', {
                  status: 200,
                  headers: {"content-type":"text/html; charset=utf-8"}
                }));
              }
              if (url.hostname === "files.gifts.ru" && url.pathname === "/reviewer/webp/15/15637_7_500.webp") {
                const png = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="), ch => ch.charCodeAt(0));
                return Promise.resolve(new Response(png, {
                  status: 200,
                  headers: {"content-type":"image/png"}
                }));
              }
              if (url.origin === location.origin && url.pathname === "/drawing" &&
                  url.searchParams.get("action") === "getOrderItemPdf" &&
                  ["12345","22345"].includes(url.searchParams.get("orderitemid"))) {
                const pdf = Uint8Array.from(atob(""), ch => ch.charCodeAt(0));
                return Promise.resolve(new Response(pdf, {
                  status: 200,
                  headers: {"content-type":"application/pdf"}
                }));
              }
              if (url.origin === location.origin && (url.pathname === "/private/order/280185" || url.pathname === "/private/order/306190")) {
                return Promise.resolve(new Response('<!doctype html><html><body><p>Заказ без выбранных нанесений</p></body></html>', {
                  status: 200,
                  headers: {"content-type":"text/html; charset=utf-8"}
                }));
              }
              return realFetch(input, init);
            };
          });
          await page.evaluate(() => new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = "https://tohaa28.github.io/gifts-layout-workbench/launcher.js?v=" + Date.now();
            s.onload = resolve;
            s.onerror = () => reject(new Error("Published launcher.js was blocked or failed to load"));
            document.documentElement.appendChild(s);
          }));
          await page.waitForSelector("#gifts-layout-workbench-host iframe", {timeout:30000});
          const frame = page.frames().find(f => f.parentFrame() === page.mainFrame());
          if (!frame) throw new Error("Workbench iframe not created");
          await frame.waitForSelector(".app", {timeout:30000});
          const title = await frame.locator(".brand").innerText();
          const toolState = await frame.evaluate(() => {
            const ids = ["fieldLogoTools","editorAddLogo","editorFit","editorCenter","editorAngle","editorRotateLeft","editorRotateRight","editorClip","editorRemoveLogo"];
            const missing = ids.filter(id => !document.getElementById(id));
            const stage = document.getElementById("stage");
            const workspace = document.querySelector(".workspace");
            const toolsEl = document.getElementById("fieldLogoTools");
            const outsideStage = !stage?.contains(toolsEl);
            const insideWorkspace = workspace?.contains(toolsEl) === true;
            const singleRow = getComputedStyle(toolsEl).flexWrap === "nowrap";
            return {missing, outsideStage, insideWorkspace, hiddenInitially: toolsEl?.hidden === true, singleRow};
          });
          if (toolState.missing.length || !toolState.outsideStage || !toolState.insideWorkspace || !toolState.hiddenInitially || !toolState.singleRow) {
            throw new Error("In-template tools are invalid: "+JSON.stringify(toolState));
          }
          console.log("In-template tools:", JSON.stringify(toolState));
          try {
            await frame.waitForFunction(() => document.body.classList.contains("simple-mode"), null, {timeout:15000});
          } catch (error) {
            const moduleProbe = await frame.evaluate(() => ({
              simpleMode: document.body.classList.contains("simple-mode"),
              readyState: document.readyState,
              pdfLib: !!globalThis.PDFLib,
              pdfJs: !!globalThis.pdfjsLib,
              currentScripts: [...document.scripts].map(s => ({src:s.src || "", type:s.type || "", inline:!s.src}))
            }));
            throw new Error("Workbench module did not initialize: "+JSON.stringify({moduleProbe,errors,error:String(error)}));
          }
          const guidedState = await frame.evaluate(() => ({
            simpleMode: document.body.classList.contains("simple-mode"),
            modeToggleHidden: document.getElementById("modeToggle")?.hidden === true || getComputedStyle(document.getElementById("modeToggle")).display === "none",
            step2Hidden: document.getElementById("orderFieldChoiceBox")?.hidden === true,
            step3Hidden: document.getElementById("editorStep3")?.hidden === true,
            step4Hidden: document.getElementById("step4Box")?.hidden === true
          }));
          if (!guidedState.simpleMode || !guidedState.modeToggleHidden || !guidedState.step2Hidden || !guidedState.step3Hidden || !guidedState.step4Hidden) {
            throw new Error("Guided workflow initial state is invalid: "+JSON.stringify(guidedState));
          }
          console.log("Guided workflow initial state:", JSON.stringify(guidedState));
          const legacyArticleBlocks = await frame.evaluate(() => ({
            selectedArticleBody: !!document.getElementById("selectedArticleBody"),
            orderDetails: !!document.getElementById("orderDetails"),
            productCard: !!document.getElementById("productCard")
          }));
          if (legacyArticleBlocks.selectedArticleBody || legacyArticleBlocks.orderDetails || legacyArticleBlocks.productCard) {
            throw new Error("Legacy separate article details/preview block is still present: "+JSON.stringify(legacyArticleBlocks));
          }
          console.log("Legacy separate article block removed:", JSON.stringify(legacyArticleBlocks));
          const login = await frame.locator("#loginForm").count();
          if (!title.includes("Макетная")) throw new Error("Workbench UI not loaded");
          if (!login) throw new Error("Login UI missing");
          const context = await frame.evaluate(() => ({
            href: location.href,
            origin: location.origin,
            baseURI: document.baseURI,
            parentOrigin: parent.location.origin,
            directFlag: document.documentElement.dataset.directGiftsMode || null
          }));
          console.log("Frame context:", JSON.stringify(context));
          const session = await frame.evaluate(async () => {
            const r = await fetch("/api/session", {cache:"no-store"});
            const text = await r.text();
            return { status:r.status, type:r.headers.get("content-type"), text };
          });
          console.log("Session raw:", JSON.stringify(session));
          let sessionJson;
          try { sessionJson = JSON.parse(session.text); } catch { sessionJson = null; }
          if (!sessionJson || sessionJson.direct !== true || sessionJson.active !== true) {
            throw new Error("Direct gifts.ru session adapter is not active: "+JSON.stringify({context,session}));
          }
          const orderData = await frame.evaluate(async () => {
            const r = await fetch("/api/orders/7920509", {cache:"no-store"});
            return await r.json();
          });
          if (!orderData.items?.[0]?.places?.includes("лицо")) {
            throw new Error("Exact order place was not parsed: "+JSON.stringify(orderData));
          }
          console.log("Exact place test:", JSON.stringify(orderData.items[0].places));
          if (orderData.items[0].placeCount !== 1 || orderData.items[0].placeCountSource !== "order-place-row" || orderData.items[0].placeCountReliable !== true) {
            throw new Error("Single-place count audit is invalid: "+JSON.stringify(orderData.items[0]));
          }
          const twoPlaceOrder = await frame.evaluate(async () => {
            const r = await fetch("/api/orders/7920510", {cache:"no-store"});
            return await r.json();
          });
          if (twoPlaceOrder.items?.[0]?.placeCount !== 2 ||
              JSON.stringify(twoPlaceOrder.items[0].places) !== JSON.stringify(["лицо","оборот"]) ||
              twoPlaceOrder.items[0].placeCountSignals?.drawTasks !== 2) {
            throw new Error("Two-place order audit is invalid: "+JSON.stringify(twoPlaceOrder));
          }
          console.log("Two-place count test:", JSON.stringify(twoPlaceOrder.items[0]));
          if (orderData.items?.[0]?.productUrl !== "https://gifts.ru/id/228756") {
            throw new Error("Product URL was not captured for preview fallback: "+JSON.stringify(orderData.items?.[0]));
          }
          const preview = await frame.evaluate(async () => {
            const r = await fetch("/api/orders/7920509/items/12345/preview", {cache:"no-store"});
            const bytes = await r.arrayBuffer();
            return {status:r.status,type:r.headers.get("content-type"),size:bytes.byteLength};
          });
          if (preview.status !== 200 || !/^image\//.test(preview.type || "") || preview.size < 10) {
            throw new Error("Product preview fallback failed: "+JSON.stringify(preview));
          }
          console.log("Product preview fallback:", JSON.stringify(preview));
          const cartFetchesBefore = await page.evaluate(() => window.__gwbCartFetches || 0);
          const basket = await frame.evaluate(async () => {
            const r = await fetch("/api/basket?refresh=test1", {cache:"no-store"});
            return await r.json();
          });
          const basketAgain = await frame.evaluate(async () => {
            const r = await fetch("/api/basket?refresh=test2", {cache:"no-store"});
            return await r.json();
          });
          const cartFetchesAfter = await page.evaluate(() => window.__gwbCartFetches || 0);
          if (!Array.isArray(basket.orders) || basket.orders.length !== 1 || basket.orders[0].number !== "7920509" ||
              basket.orders.some(x => x.number === "1111111") ||
              basket.refreshedFromSite !== true || !/^site-/.test(basket.source || "") ||
              !Array.isArray(basketAgain.orders) || basketAgain.orders[0]?.number !== "7920509" ||
              cartFetchesAfter < cartFetchesBefore + 2) {
            throw new Error("Fresh site basket verification failed: "+JSON.stringify({basket,basketAgain,cartFetchesBefore,cartFetchesAfter}));
          }
          console.log("Fresh site basket:", JSON.stringify({source:basket.source,scanned:basket.scanned,cartFetchesBefore,cartFetchesAfter}));

          await frame.waitForSelector("#basketOrders .basket-order > button", {state:"attached", timeout:30000});
          await frame.locator("#basketOrders .basket-order > button").first().click();
          try {
            await frame.waitForSelector("#orderEditor:not([hidden])", {timeout:30000});
          } catch (error) {
            const orderOpenDiagnostics = await frame.evaluate(() => ({
              status: document.getElementById("status")?.textContent || "",
              progress: document.getElementById("orderProgressText")?.textContent || "",
              orderLoadingHidden: document.getElementById("orderLoading")?.hidden,
              orderStepHidden: document.getElementById("orderStep")?.hidden,
              orderStep: document.getElementById("orderStep")?.textContent || "",
              orderEditorHidden: document.getElementById("orderEditor")?.hidden,
              articleCards: document.querySelectorAll("#orderTemplateList .article-choice").length,
              templateName: document.getElementById("templateName")?.textContent || ""
            }));
            throw new Error("Order editor did not open: "+JSON.stringify({orderOpenDiagnostics,errors,error:String(error)}));
          }
          await frame.waitForSelector("#orderTemplateList .article-choice", {state:"attached", timeout:30000});
          await frame.waitForFunction(() => document.getElementById("orderFieldChoiceBox")?.hidden === false, null, {timeout:30000});
          await frame.waitForFunction(() => {
            const img = document.querySelector("#orderTemplateList .article-thumb");
            return !!img && img.hidden === false && img.complete && img.naturalWidth > 0;
          }, null, {timeout:30000});

          const articleChoiceState = await frame.evaluate(() => {
            const choice = document.querySelector("#orderTemplateList .article-choice");
            const info = choice?.querySelector(".article-choice-info");
            const summary = document.getElementById("orderTemplateSummary");
            const rows = {};
            for (const row of choice?.querySelectorAll(".article-row") || []) {
              const key = row.querySelector(".detail-key")?.textContent?.trim();
              const value = row.querySelector(".detail-value")?.textContent?.trim();
              if (key) rows[key] = value || "";
            }
            const badgeContent = choice ? getComputedStyle(choice, "::after").content : "";
            return {
              choiceExists: !!choice,
              previewInsideChoice: !!choice?.querySelector(".article-thumb-wrap .article-thumb"),
              previewSrc: choice?.querySelector(".article-thumb")?.getAttribute("src") || "",
              previewLoaded: (() => { const img=choice?.querySelector(".article-thumb"); return !!img && !img.hidden && img.complete && img.naturalWidth > 0 && img.naturalHeight > 0; })(),
              redundantSummaryHidden: !!summary && getComputedStyle(summary).display === "none",
              badgeRemoved: !/Выбрано/.test(badgeContent || ""),
              selectedPaddingRight: choice ? parseFloat(getComputedStyle(choice).paddingRight) : 999,
              infoPaddingRight: info ? parseFloat(getComputedStyle(info).paddingRight) : 999,
              rows,
              legacySeparateBlocks: ["selectedArticleBody","orderDetails","productCard"].some(id => !!document.getElementById(id))
            };
          });
          if (!articleChoiceState.choiceExists ||
              !articleChoiceState.previewInsideChoice ||
              !articleChoiceState.previewLoaded ||
              !articleChoiceState.redundantSummaryHidden ||
              !articleChoiceState.badgeRemoved ||
              articleChoiceState.selectedPaddingRight > 20 ||
              articleChoiceState.infoPaddingRight > 4 ||
              articleChoiceState.legacySeparateBlocks ||
              articleChoiceState.rows["Артикул"] !== "15637" ||
              articleChoiceState.rows["Название"] !== "Брелок" ||
              articleChoiceState.rows["Тираж"] !== "10 шт." ||
              !/Лазерная гравировка/.test(articleChoiceState.rows["Нанесение"] || "") ||
              articleChoiceState.rows["Место"] !== "лицо" ||
              articleChoiceState.rows["Контроль мест"] !== "1 в заказе = 1 в шаблоне") {
            throw new Error("Integrated article choice is invalid: "+JSON.stringify(articleChoiceState));
          }
          console.log("Integrated article choice:", JSON.stringify(articleChoiceState));

          const stageAspect = await frame.evaluate(() => {
            const stage = document.getElementById("stage");
            const canvas = document.getElementById("templateCanvas");
            const box = stage?.getBoundingClientRect();
            return {
              cssWidth: box?.width || 0,
              cssHeight: box?.height || 0,
              cssRatio: box?.height ? box.width / box.height : 0,
              canvasWidth: canvas?.width || 0,
              canvasHeight: canvas?.height || 0,
              canvasRatio: canvas?.height ? canvas.width / canvas.height : 0,
              minWidth: stage?.style.minWidth || ""
            };
          });
          const stageRatioError = stageAspect.canvasRatio
            ? Math.abs(stageAspect.cssRatio / stageAspect.canvasRatio - 1)
            : 1;
          if (!(stageAspect.cssWidth > 0) || !(stageAspect.cssHeight > 0) ||
              stageRatioError > 0.01 || stageAspect.minWidth !== "0px") {
            throw new Error("Stage aspect ratio is not preserved: "+JSON.stringify({stageAspect,stageRatioError}));
          }
          console.log("Stage aspect ratio:", JSON.stringify({...stageAspect,stageRatioError}));

          const fieldOptionCount = await frame.locator("#orderFieldChoice option:not([value=''])").count();
          if (fieldOptionCount > 0) {
            await frame.selectOption("#orderFieldChoice", {index:1});
            await frame.waitForFunction(() => {
              const step3 = document.getElementById("editorStep3");
              return step3 && step3.hidden === false;
            }, null, {timeout:30000});
            await frame.waitForTimeout(100);
            const fieldStage = await frame.evaluate(() => {
              const stage = document.getElementById("stage");
              const template = document.getElementById("templateCanvas");
              const overlay = document.getElementById("overlay");
              const stageBox = stage.getBoundingClientRect();
              const templateBox = template.getBoundingClientRect();
              const overlayBox = overlay.getBoundingClientRect();
              const num = value => Number.parseFloat(value || "0") || 0;
              return {
                stage:{w:stageBox.width,h:stageBox.height,styleW:stage.style.width,styleH:stage.style.height,minW:stage.style.minWidth,maxW:getComputedStyle(stage).maxWidth,maxH:getComputedStyle(stage).maxHeight},
                template:{w:templateBox.width,h:templateBox.height,pixelW:template.width,pixelH:template.height,cssW:getComputedStyle(template).width,cssH:getComputedStyle(template).height},
                overlay:{w:overlayBox.width,h:overlayBox.height,pixelW:overlay.width,pixelH:overlay.height,cssW:getComputedStyle(overlay).width,cssH:getComputedStyle(overlay).height},
                scroll:{w:document.getElementById("stageScroll").clientWidth,h:document.getElementById("stageScroll").clientHeight},
                ratios:{
                  stage:stageBox.height?stageBox.width/stageBox.height:0,
                  templateCss:templateBox.height?templateBox.width/templateBox.height:0,
                  templatePixels:template.height?template.width/template.height:0,
                  overlayCss:overlayBox.height?overlayBox.width/overlayBox.height:0,
                  overlayPixels:overlay.height?overlay.width/overlay.height:0
                }
              };
            });
            console.log("Field stage diagnostics:", JSON.stringify(fieldStage));
            const renderedFieldPixels = await frame.evaluate(() => {
              const canvas = document.getElementById("templateCanvas");
              const ctx = canvas.getContext("2d", {willReadFrequently:true});
              const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
              let minX=canvas.width, minY=canvas.height, maxX=-1, maxY=-1, count=0;
              for (let y=0; y<canvas.height; y++) {
                for (let x=0; x<canvas.width; x++) {
                  const p=(y*canvas.width+x)*4;
                  const r=data[p], g=data[p+1], b=data[p+2], a=data[p+3];
                  if (a > 80 && b > 120 && g > 70 && r < 100 && b > r + 50) {
                    minX=Math.min(minX,x); minY=Math.min(minY,y);
                    maxX=Math.max(maxX,x); maxY=Math.max(maxY,y); count++;
                  }
                }
              }
              const w=maxX>=minX?maxX-minX+1:0;
              const h=maxY>=minY?maxY-minY+1:0;
              return {minX,minY,maxX,maxY,w,h,count,ratio:h?w/h:0};
            });
            console.log("Rendered field pixels:", JSON.stringify(renderedFieldPixels));
            if (renderedFieldPixels.count < 20 || Math.abs(renderedFieldPixels.ratio - 1) > 0.02) {
              throw new Error("Rendered square field is distorted after zoom: "+JSON.stringify(renderedFieldPixels));
            }
            const ratios = fieldStage.ratios;
            const fieldRatioError = Math.max(
              Math.abs(ratios.stage / ratios.templatePixels - 1),
              Math.abs(ratios.templateCss / ratios.templatePixels - 1),
              Math.abs(ratios.overlayCss / ratios.overlayPixels - 1)
            );
            if (!Number.isFinite(fieldRatioError) || fieldRatioError > 0.01) {
              throw new Error("Field view stretches the canvas: "+JSON.stringify({fieldStage,fieldRatioError}));
            }
          }

          await frame.click("#backToOrders");
          await frame.waitForSelector("#orderBrowser:not([hidden])", {timeout:30000});
          await frame.evaluate(() => {
            document.getElementById("order").value = "7920510";
            document.getElementById("loadOrder").click();
          });
          await frame.waitForFunction(() => {
            const loading = document.getElementById("orderLoading");
            const editor = document.getElementById("orderEditor");
            const row=[...document.querySelectorAll("#orderTemplateList .article-row")].find(x => x.querySelector(".detail-key")?.textContent?.trim()==="Контроль мест");
            return loading?.hidden === true &&
              editor?.hidden === false &&
              row?.querySelector(".detail-value")?.textContent?.includes("2 в заказе ≠ 1 в шаблоне") &&
              /ОШИБКА КОНТРОЛЯ/.test(document.getElementById("fieldChoiceHint")?.textContent || "");
          }, null, {timeout:30000});
          const mismatchState = await frame.evaluate(() => ({
            audit:[...document.querySelectorAll("#orderTemplateList .article-row")].find(x => x.querySelector(".detail-key")?.textContent?.trim()==="Контроль мест")?.querySelector(".detail-value")?.textContent?.trim() || "",
            mismatchClass:document.querySelector("#orderTemplateList .article-choice")?.classList.contains("place-count-mismatch") === true,
            hint:document.getElementById("fieldChoiceHint")?.textContent || "",
            hintUnmatched:document.getElementById("fieldChoiceHint")?.classList.contains("unmatched") === true,
            selectedField:document.getElementById("orderFieldChoice")?.value || "",
            step3Hidden:document.getElementById("editorStep3")?.hidden === true
          }));
          if (mismatchState.audit !== "2 в заказе ≠ 1 в шаблоне" ||
              !mismatchState.mismatchClass || !mismatchState.hintUnmatched ||
