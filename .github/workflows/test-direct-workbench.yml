name: Test direct Workbench on gifts.ru

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - gifts-layout-workbench-source
      - gifts-layout-workbench-step-motion-preview
    paths:
      - "direct-mode.js"
      - "editor.html"
      - "mockup-profiles.json"
      - "tools/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/test-direct-workbench.yml"

