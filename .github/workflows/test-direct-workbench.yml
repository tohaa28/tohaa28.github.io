      - run: node tools/build-launcher.mjs
      - run: node --check direct-mode.js
      - run: node --check assets/index-BpU9kvz8.js
      - run: npm init -y
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium firefox
      - name: Verify disclosures and window motion in Chromium and Firefox
        run: node tests/motion-disclosure-browser-runner.mjs
