name: Mirror Workbench frontend

on:
  push:
    branches:
      - gifts-layout-workbench-source
    paths:
      - ".github/workflows/mirror-workbench.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gifts-layout-workbench-source
          fetch-depth: 0

      - name: Download current Worx frontend
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gifts-layout-workbench.tohaa28.chatgpt.site"
          mkdir -p assets vendor
          curl --fail --location --retry 3 "$BASE/" -o index.html
          curl --fail --location --retry 3 "$BASE/assets/index-BpU9kvz8.js" -o assets/index-BpU9kvz8.js
          curl --fail --location --retry 3 "$BASE/assets/index-CdEUuUA7.css" -o assets/index-CdEUuUA7.css
          curl --fail --location --retry 3 "$BASE/vendor/pdf-lib.min.js" -o vendor/pdf-lib.min.js
          curl --fail --location --retry 3 "$BASE/vendor/jszip.min.js" -o vendor/jszip.min.js
          curl --fail --location --retry 3 "$BASE/vendor/jspdf.umd.min.js" -o vendor/jspdf.umd.min.js
          curl --fail --location --retry 3 "$BASE/vendor/svg2pdf.umd.min.js" -o vendor/svg2pdf.umd.min.js

      - name: Verify mirrored files
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < assets/index-BpU9kvz8.js)" -gt 400000
          test "$(wc -c < assets/index-CdEUuUA7.css)" -gt 15000
          test "$(wc -c < vendor/pdf-lib.min.js)" -gt 500000
          test "$(wc -c < vendor/jszip.min.js)" -gt 90000
          test "$(wc -c < vendor/jspdf.umd.min.js)" -gt 400000
          test "$(wc -c < vendor/svg2pdf.umd.min.js)" -gt 80000
          grep -q "/api/session" assets/index-BpU9kvz8.js

      - name: Commit exact frontend mirror
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "workbench-migration"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets vendor
          if git diff --cached --quiet; then
            echo "No frontend changes"
          else
            git commit -m "Mirror exact current Worx frontend"
            git push origin HEAD:gifts-layout-workbench-source
          fi
